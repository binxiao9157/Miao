<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF5F0" />

    <!-- 关键资源预加载：启动屏图片在 HTML 解析阶段即开始下载 -->
    <link rel="preload" as="image" type="image/webp" href="/splash.webp" />
    <link rel="preload" as="image" href="/logo.png" />

    <!-- Google Fonts 异步加载：先用系统字体渲染，字体到达后无缝替换 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Miao" />
    <link rel="icon" type="image/png" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- iOS Splash Screen Placeholder -->
    <link rel="apple-touch-startup-image" href="/og-image.jpg" />
    
    <!-- Open Graph / WeChat Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Miao - 记录与猫咪的每一个瞬间" />
    <meta property="og:description" content="开启您与猫咪的数字治愈之旅" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://www.mmdd10.tech" />
    <link rel="image_src" href="/og-image.jpg" />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="thumbnail" content="/og-image.jpg" />
    
    <!-- WeChat specific: First image in body is used as fallback -->
    <meta itemprop="image" content="/og-image.jpg" />
    
    <title>Miao - 遇见你的数字猫咪</title>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #FFF5F0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }
      /* 添加与 App 一致的波点背景，增强视觉一致性 */
      #splash-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, #E5D5C8 1px, transparent 1px);
        background-size: 32px 32px;
        opacity: 0.2;
        z-index: 0;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen .splash-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        animation: splash-entry 1s ease-out;
      }
      @keyframes splash-entry {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
      #splash-screen .splash-logo {
        width: 100px;
        height: 100px;
        object-fit: contain;
        filter: drop-shadow(0 12px 24px rgba(232, 159, 113, 0.2));
      }
      #splash-screen .splash-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 32px;
        color: #633E1D;
        letter-spacing: 3px;
        background: linear-gradient(to right, #633E1D, #E89F71);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body style="background-color: #FFF5F0;">
    <!-- WeChat Share Image Fallback (Hidden) -->
    <div style="display:none;">
      <img src="/og-image.jpg" alt="share" />
    </div>

    <!-- 启动屏：纯 HTML/CSS，不依赖 JS 框架，首帧即渲染 -->
    <div id="splash-screen">
      <div class="splash-content">
        <img src="/logo.png" alt="Miao" class="splash-logo" />
        <div class="splash-text">Miao</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
